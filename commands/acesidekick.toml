description = "Local LLM sidekick — delegates cheap tasks to Ollama (qwen2.5-coder), keeps reasoning on main model"
prompt = "Activate /acesidekick. Args: {{args}}. First use Bash tool to check Ollama: curl -s http://localhost:11434/api/tags. Report detected models. Default mode=auto: delegate mechanical tasks (docstrings, stubs, regex, boilerplate, summaries, changelog) to qwen2.5-coder:7b or qwen2.5-coder:14b via Bash+curl. Keep reasoning/architecture/security/debugging here. If args=light: suggest delegation only, ask before each. If args=strict: offload everything possible. If args=off: disable. Report what was delegated after each task. Output: 'acesidekick active [mode]. Ollama: [status]'"
